name: Release FPK
run-name: Release FPK - ${{ github.ref_name }}

# A release is created only from an immutable v* tag.  The job must produce a
# real native FPK from the locked closure; it never turns source archives into
# release substitutes and never reads ignored local release/ files.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-fpk-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    name: Create release for manual package upload
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[A-Za-z0-9._-]+$ ]] || exit 1
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "飞牛 PT 下载 $TAG" \
              --notes "原生 x86_64 qBittorrent 5.2.4，支持 PT 下载与保种、限速、分享率、标签分类和 MoviePilot。安装包由维护者手动上传；仅有源码下载项不表示 FPK 已就绪。发布范围、校验值及验收边界：https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/releases/$TAG.md 。NAS 和物理手机兼容性尚未闭环。"
          fi

  build-and-release:
    if: ${{ vars.ENABLE_NATIVE_FPK_BUILD == 'true' }}
    needs: create-release
    name: Build and publish x86_64 FPK
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[A-Za-z0-9._-]+$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build and verify UI and Go application
        run: python3 tools/build_checkout.py

      - name: Download and verify locked source inputs
        run: python3 tools/fetch_native_inputs.py --cache .runtime/native-input-cache

      - name: Verify complete native build closure
        run: python3 tools/check_native_ci_inputs.py

      # This is deliberately after the closure gate.  A missing compiler,
      # runtime, qB build, Qt ABI, or fnpack input fails the run; no placeholder
      # FPK and no source/validation archive is ever published.
      - name: Build native qBittorrent runtime and FPK
        run: python3 tools/build_native_1_4_8.py

      - name: Audit FPK, checksum, and smoke test
        shell: bash
        run: |
          set -euo pipefail
          FPK="release/fnos-qbittorrent-native-${TAG#v}-x86_64.fpk"
          test -s "$FPK"
          sha256sum "$FPK" > "$FPK.sha256"
          python3 tools/audit_release_fpk.py "$FPK"
          python3 tools/smoke_release_fpk.py "$FPK"

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes "Automated x86_64 native FPK build. Source remains in Git."
          fi

      - name: Upload only FPK and SHA256 without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FPK="release/fnos-qbittorrent-native-${TAG#v}-x86_64.fpk"
          for asset in "$FPK" "$FPK.sha256"; do
            name="$(basename "$asset")"
            names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -Fxq "$name" <<< "$names"; then
              echo "Immutable asset already exists; refusing to overwrite: $name"
              exit 1
            fi
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            verify_dir="$(mktemp -d)"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$verify_dir"
            cmp "$asset" "$verify_dir/$name"
            rm -rf "$verify_dir"
          done
