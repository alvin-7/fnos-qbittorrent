name: Release assets
run-name: Release assets - ${{ inputs.tag || github.ref_name }}

# A tag push is the release source of truth. The workflow creates the GitHub
# Release when needed, then uploads only artifacts built in this run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v1.4.9)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    name: Validate source and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[A-Za-z0-9._-]+$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          echo "Building immutable tag $TAG"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build and verify the source checkout
        # This deliberately builds only the UI, gateway and native-control.
        # It does not claim to build qBittorrent or a complete FPK.
        run: python3 tools/build_checkout.py

      - name: Create source and validation bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${TAG#v}"
          prefix="fnos-qbittorrent-${version}"
          git archive --format=tar.gz --prefix="${prefix}/" --output="dist/${prefix}-source.tar.gz" "$TAG"
          tar -czf "dist/${prefix}-checkout-validation.tar.gz" -C .runtime checkout-build
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS
          printf '%s\n' \
            "Tag: ${TAG}" \
            "Commit: $(git rev-parse HEAD)" \
            "Source archive: ${prefix}-source.tar.gz" \
            "Validation archive: ${prefix}-checkout-validation.tar.gz" \
            '' \
            'FPK status:' \
            '- A complete native qBittorrent FPK was NOT rebuilt by this workflow.' \
            '- The repository does not contain the complete locked compiler/runtime/fnpack closure required for a clean FPK build.' \
            '- Do not infer an FPK from these archives. A matching FPK, if supplied later, must be manually uploaded and independently SHA256-verified.' \
            '' \
            'Validation:' \
            '- UI and Go source checkout build/tests were executed by tools/build_checkout.py.' \
            '- No ignored local release/ asset is read or uploaded.' \
            > dist/release-notes.md

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving its notes and assets"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file dist/release-notes.md
          fi

      - name: Upload immutable CI assets and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Never use --clobber: a same-name asset is immutable. On reruns,
          # download and verify an existing asset instead of replacing it.
          for asset in dist/*.tar.gz dist/SHA256SUMS; do
            name="$(basename "$asset")"
            expected="$(sha256sum "$asset" | awk '{print $1}')"
            names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if ! grep -Fxq "$name" <<< "$names"; then
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
            # Read back both new and existing remote bytes, never overwrite.
            verify_dir="$(mktemp -d)"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" \
              --dir "$verify_dir"
            actual="$(sha256sum "$verify_dir/$name" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || {
              echo "Immutable asset checksum mismatch: $name" >&2
              exit 1
            }
            rm -rf "$verify_dir"
            echo "Verified remote asset $name ($actual)"
          done
