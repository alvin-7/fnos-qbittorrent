<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>fnOS PT · 下载目录选择器 · 手机</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#182334;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dce2eb;background:white;border-radius:9px;padding:10px 16px;min-height:44px;color:inherit}button:hover{background:#f2f6ff}button:focus-visible{outline:3px solid #82aaff;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.45}.primary{background:#2864dd;color:white;border-color:#2864dd}.primary:hover{background:#1f53bd}.muted{color:#69768a}.small{font-size:12px}.badge{padding:4px 10px;border-radius:6px;background:#eaf2ff;color:#2559b5;font-size:12px}.review{height:64px;background:#142237;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}.review select{padding:8px;border-radius:6px}.shell{max-width:1180px;margin:32px auto}.nav{font-size:20px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:26px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:24px}.entry{display:flex;gap:10px;margin:10px 0}.entry input{flex:1;min-width:0;padding:12px;border:1px solid #dce2eb;border-radius:8px}.backdrop{position:fixed;inset:64px 0 0;background:#1d2c414a;display:flex;align-items:center;justify-content:center;padding:24px}.picker{background:#fff;width:620px;border:1px solid #dce2eb;border-radius:16px;box-shadow:0 22px 80px #10274630;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 110px)}header{padding:22px 24px 16px;border-bottom:1px solid #e8edf4}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:20px;margin:0}p{margin:6px 0}.icon{padding:6px;min-width:44px;font-size:20px}.crumb{display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid #e8edf4;color:#64748b;min-height:58px}.crumb button{padding:8px 10px}.scroll{padding:14px 24px;overflow:auto;min-height:240px;flex:1}.section-label{font-size:11px;letter-spacing:1px;color:#718098;margin-bottom:10px}.row{display:flex;width:100%;align-items:center;text-align:left;border:1px solid transparent;border-radius:8px;min-height:48px;padding:0 12px;gap:10px;margin:2px 0}.row.selected{background:#edf4ff;border-color:#b9d0fb;color:#194da8}.row .tail{margin-left:auto;font-size:12px}.folder{color:#5b81b8;font-size:20px}.level1{padding-left:36px}.level2{padding-left:60px}.foot{background:#fafbfd;border-top:1px solid #e4eaf2;padding:16px 24px 20px}.path{word-break:break-all;font:13px/1.7 Consolas,"Microsoft YaHei",monospace;margin:4px 0}.actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:14px}.actions .note{margin-right:auto;font-size:12px;color:#6e7b8e}.empty{text-align:center;padding:36px 12px;color:#64748b}.empty .symbol{font-size:28px;margin-bottom:10px}.empty strong{display:block;color:#24344c;font-size:16px;margin-bottom:8px}.reason{font-size:12px;color:#a46417;margin-top:8px}.status-ok{color:#31815b;font-size:12px}.toast{padding:12px;border-radius:8px;background:#ebf7ef;margin-top:12px}.phone-back{display:none}.mobile .review{padding:0 12px;font-size:12px}.mobile .review strong{max-width:130px}.mobile .shell{padding:16px;margin:0}.mobile .backdrop{padding:0;align-items:stretch}.mobile .picker{width:100%;max-height:none;border-radius:0;border:0;box-shadow:none}.mobile header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}.mobile h1{font-size:18px}.mobile .phone-back{display:block}.mobile .crumb{padding:10px 16px;flex-wrap:wrap;font-size:12px}.mobile .scroll{padding:16px;min-height:0}.mobile .foot{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}.mobile .actions{display:grid;grid-template-columns:1fr 1.7fr}.mobile .actions .note{grid-column:1/-1;margin:0}.mobile .row{min-height:56px}.mobile .row.level1{padding-left:32px}.mobile .row.level2{padding-left:52px}.mobile .current{padding:14px;background:#edf4ff;border:1px solid #b9d0fb;border-radius:10px;margin-bottom:16px}.mobile .tree-button{margin-left:auto}.mobile .badge{font-size:11px}.mobile .foot .path{font-size:12px}.design-caption{font-size:12px;color:#69768a;margin-top:12px}</style><body class="mobile">
<div class="review"><strong>fnOS PT · 目录选择</strong><label>状态 <select id="states" onchange="setState(this.value)"><option value="ready">已选中</option><option value="none">无授权</option><option value="denied">无权限 / 授权变化</option><option value="loading">加载中</option><option value="offline">离线</option><option value="readonly">只读</option></select></label></div>
<main class="shell"><div class="nav">fnOS PT <span class="badge">设计评审 · 无 NAS 连接</span></div><section class="card"><h1>添加下载任务</h1><p class="muted">保存位置</p><div class="entry"><input id="savepath" aria-label="保存位置" value="/示例授权目录A/下载"><button id="open" onclick="openPicker()">选择目录</button></div><p class="small muted">选择只回填此表单，不会开始下载。</p><div class="toast" id="result" hidden></div></section><p class="design-caption">所有目录、权限和状态均为示例。不读取 NAS，不调用任何业务写入。</p></main>
<div class="backdrop"><section class="picker" role="dialog" aria-modal="true" aria-labelledby="title"><header><div class="head"><button class="icon phone-back" aria-label="返回上一级" onclick="parent()">‹</button><h1 id="title">选择下载目录</h1><button class="icon" aria-label="关闭，放弃此次选择" onclick="closePicker()">×</button></div><p class="muted small">仅显示本应用已授权目录</p><span class="badge">示例数据 · 非真实 NAS 路径</span></header><nav class="crumb" aria-label="目录层级"><button onclick="parent()">‹ 上一级</button><span id="crumbtext"></span><button class="tree-button" id="treeToggle" onclick="toggleTree()">层级树</button></nav><div class="scroll" id="content"></div><footer class="foot"><div class="small muted">当前完整路径（示例）</div><div class="path" id="fullpath"></div><div id="permission"></div><div class="actions"><span class="note">仅回填，不保存、不下载、不移动</span><button id="cancel" onclick="closePicker()">取消</button><button class="primary" id="confirm" onclick="useDir()">使用此目录</button></div></footer></section></div><script>let state='ready', selected='电影', tree=false, expanded=true; const original='/示例授权目录A/下载';
const $=s=>document.querySelector(s);const mobile=document.body.classList.contains('mobile');
function path(){return '/示例授权目录A/'+selected}
function selectDir(s){selected=s;state='ready';render()}
function row(label,level,sel,action,tail=''){return `<button class="row level${level} ${sel?'selected':''}" role="${tree||!mobile?'treeitem':'button'}" aria-selected="${sel}" onclick="${action}"><span class="folder">▱</span><span>${label}</span><span class="tail">${sel?'✓ 已选中':tail}</span></button>`}
function render(){let ok=state==='ready';let msgs={none:['∅','未找到可用的已授权目录','请在飞牛应用设置检查本应用授权后刷新。未授权目录不会显示。'],denied:['⊘','此目录不可用或未授权','权限可能已变化，请返回已授权目录重新选择。不会展示不可读目录名称。'],loading:['◌','正在读取当前层…','仅加载当前层目录，不递归扫描。'],offline:['☁','暂时无法连接目录服务','未使用旧授权或缓存目录，请检查连接后重试。'],readonly:['⊘','当前目录为只读','可以浏览，但不能作为下载保存位置。']};
$('#crumbtext').textContent=ok||state==='readonly'?'示例授权目录 A › '+selected:'已授权目录';
$('#fullpath').textContent=ok||state==='readonly'?path():'未选择可用目录';
$('#confirm').disabled=!ok;$('#permission').textContent=ok?'✓ 应用可写 · 当前用户可写（示例状态）':state==='readonly'?'只读，无法使用此目录':'确认已停用：'+msgs[state][1];$('#permission').className=ok?'status-ok':'reason';
if(!ok&&state!=='readonly'){let m=msgs[state];$('#content').innerHTML=`<div class="empty" role="${state==='loading'?'status':'alert'}"><div class="symbol">${m[0]}</div><strong>${m[1]}</strong><p>${m[2]}</p>${state==='loading'?'':'<button onclick="setState(&quot;ready&quot;)">重新核验授权</button>'}</div>`;return}
if(mobile&&!tree){$('#content').innerHTML=`<div class="current"><div class="small muted">当前目录 · 示例</div><strong>${selected}</strong><span style="float:right;color:#2559b5">✓ 已选中</span></div><div class="section-label">当前层子目录 · 按需加载</div>`+row('4K',0,false,"selectDir('电影/4K')",'进入 ›')+row('剧集',0,false,"selectDir('电影/剧集')",'进入 ›')+`<p class="design-caption">仅显示本应用已授权且当前用户可读的目录。</p>`}
else{$('#content').innerHTML=`<div class="section-label">已授权目录 · 以下均为模拟路径</div><div role="tree" aria-label="已授权目录树"><button class="row" role="treeitem" aria-expanded="${expanded}" onclick="expanded=!expanded;render()"><span>${expanded?'⌄':'›'}</span><span class="folder">▱</span><strong>示例授权目录 A</strong><span class="tail badge">应用已授权</span></button>${expanded?row('电影',1,selected==='电影',"selectDir('电影')",'')+row('4K',2,selected==='电影/4K',"selectDir('电影/4K')",'›')+row('剧集',2,selected==='电影/剧集',"selectDir('电影/剧集')",'›')+row('下载',1,selected==='下载',"selectDir('下载')",'›'):''}${row('示例授权目录 B',0,false,"selectDir('下载')",'›')}</div>`}
if(state==='readonly')$('#content').insertAdjacentHTML('beforeend','<p class="reason" role="alert">此示例目录只读：可浏览，不可确认。</p>')}
function setState(s){state=s;$('#states').value=s;render()}
function closePicker(){ $('.backdrop').style.display='none';$('#open').focus() }
function openPicker(){ $('.backdrop').style.display='flex';setState('ready');$('#cancel').focus() }
function useDir(){if(state!=='ready')return;$('#savepath').value=path();closePicker();$('#result').hidden=false;$('#result').textContent='已回填草稿：'+path()+'。尚未保存设置、添加下载或移动任务。'}
function parent(){selected=selected.includes('/')?'电影':'下载';render()}
function toggleTree(){tree=!tree;$('#treeToggle').textContent=tree?'分层浏览':'层级树';render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePicker()});render();
</script></body></html>
