return head+`<section aria-label="授权卷存储"><div class="section-head"><h2>授权下载目录所属卷</h2><small>同卷多目录只计一次</small></div><div class="info"><strong>可取得的唯一卷：总 ${total.toFixed(1)} TiB / 已用 ${used.toFixed(1)} TiB</strong><br>2 个可取得 / 5 个示例卷；3 个异常卷不参与合计。卷容量不是下载目录用量，也不是单块物理硬盘用量。</div><div class="analysis-grid">${volumes.map(v=>`<article class="volume-card"><h3>${v.name}</h3><small>卷身份 ${v.id} · ${v.roots.length} 个授权目录</small>${v.status==='ready'?`<div class="volume-numbers"><div><span>已用 · total − free</span><strong>${(v.total-v.free).toFixed(1)} TiB</strong></div><div><span>总容量</span><strong>${v.total.toFixed(1)} TiB</strong></div></div><div class="progress"><i style="width:${(v.total-v.free)/v.total*100}%"></i></div><small>空闲 free ${v.free.toFixed(1)} TiB · 当前身份可用 available ${v.available.toFixed(1)} TiB</small><small>保留 / 身份不可用 ${(v.free-v.available).toFixed(1)} TiB，不算已用。</small>`:`<div class="error-box"><strong>${{offline:'卷已离线',permission_denied:'权限不足',unavailable:'容量不可取得'}[v.status]}</strong>总容量 / 已用 / 可用：未知，不显示为 0</div>`}<small>${v.roots.map(esc).join('<br>')}</small></article>`).join('')}</div><div class="info analysis-notes">仅限授权卷。后续需服务端 statfs 或平台可信卷 API 提供稳定卷 / 挂载身份和容量；不是 qB 已有完整容量 API。不得全盘读取或递归扫描。多目录同卷与绑定挂载归一后去重；共享池不能仅按挂载名重复累加，身份未确认则不合计。</div></section>
<section aria-label="PT站保种统计"><div class="section-head"><h2>按 PT 站保种</h2></div><div class="analysis-toolbar"><label for="seed-scope">统计口径</label><select id="seed-scope"><option value="eligible" ${S.seedScope==='eligible'?'selected':''}>可保种已完成任务（默认）</option><option value="running" ${S.seedScope==='running'?'selected':''}>当前运行做种</option></select><label for="analysis-sort">站点排序</label><select id="analysis-sort"><option value="size" ${S.analysisSort==='size'?'selected':''}>逻辑体积 ↓</option><option value="count" ${S.analysisSort==='count'?'selected':''}>任务数 ↓</option><option value="name" ${S.analysisSort==='name'?'selected':''}>站点名称</option></select></div><p class="muted">${S.seedScope==='eligible'?'已完成且文件可用的 private 任务，包含暂停、排队、强制与运行状态；不含尚未下载完成任务。':'仅 uploading / stalledUP / forcedUP；零上传速率的等待连接做种仍属运行，不含暂停 / 排队。'}</p><div id="site-rows">${rows.length?rows.map(r=>`<div class="site-row"><button data-station="${r.id}">${esc(siteName(r.id))}<small>${r.id==='unknown'?'映射未知，不由标签猜测':'已脱敏 Tracker 域名 / 人工映射'} → 查看任务</small></button><span>${r.hashes.size} 项</span><strong>${r.size.toFixed(1)} GB</strong></div>`).join(''):'<div class="empty">此口径暂无符合条件的 PT 任务</div>'}</div><div class="site-total">跨站去重合计 ${unique.length} 项 · ${unique.reduce((n,t)=>n+parseFloat(t.size),0).toFixed(1)} GB</div><div class="info analysis-notes">体积使用任务逻辑总大小，不等于独占物理磁盘。相同 hash 在同站多 Tracker 只计一次，跨站可多归属，因此站点行不可直接相加。公开任务不计入；缺失文件、校验中与错误任务不算可保种。<br>站点仅由 private 任务的 Tracker 域名与人工映射确定；不保存或展示 passkey、路径、query，不从 PT 标签猜站点。未知映射保留未知。</div><div class="info">点站点返回唯一任务列表：保留状态 / 搜索 / 分类 / 标签，新增或替换站点条件（AND）；展示该站全部任务，不隐式带入分析口径。无结果可单独清除站点或清除全部；返回任务按钮不修改任何筛选与滚动。</div></section>`+qaAnalysis;

function navigate(v){S.scrolls[S.nav]=window.scrollY;S.nav=v;S.selected.clear();S.selectMode=false;S.detail=0;render();window.scrollTo(0,S.scrolls[v]||0)}
function openSheet(type,push=true){S.stack.push(type);if(push)history.pushState({layer:true},'');drawSheet();if(!$('#sheet').open)$('#sheet').showModal();document.body.classList.add('locked');document.body.classList.add('sheet-open')}
function closeSheet(fromHistory=false){if(!fromHistory){history.back();return}S.stack.pop();if(S.stack.length)drawSheet();else{$('#sheet').close();document.body.classList.remove('locked');document.body.classList.remove('sheet-open')}}
function rememberAdd(){['url','path','cat','tag'].forEach(k=>{let e=$('#add-'+k);if(e)S.add[k]=e.value});if($('#add-paused'))S.add.paused=$('#add-paused').checked}
function drawSheet(){const type=S.stack.at(-1);let title='',body='',foot='';if(type==='add'){title='添加任务';body=`<span class="badge demo">示例提交 · 不会发起下载</span><label>磁力 / HTTP 链接（每行一项）</label><textarea id="add-url" placeholder="粘贴 magnet: 或 https:// 链接">${esc(S.add.url)}</textarea><label>或选择本地种子文件（仅显示文件名）</label><input id="torrent-file" type="file" accept=".torrent"><label>保存目录 · 示例路径</label><div class="inline"><input id="add-path" value="${esc(S.add.path)}" readonly>${btn('浏览目录','directory')}</div><div class="inline"><div style="flex:1"><label>分类</label><select id="add-cat">${['电影','剧集','音乐','软件'].map(v=>`<option ${S.add.cat===v?'selected':''}>${v}</option>`).join('')}</select></div><div style="flex:1"><label>标签</label><select id="add-tag">${['PT','保种','MoviePilot'].map(v=>`<option ${S.add.tag===v?'selected':''}>${v}</option>`).join('')}</select></div></div><label class="inline"><input id="add-paused" type="checkbox" ${S.add.paused?'checked':''}> 添加后暂停（示例）</label><div id="add-error" role="alert"></div>`;foot=btn('取消','back')+btn('添加示例任务','submit-add','class="primary"')}
else if(type==='directory'||type==='directory-denied'){title='选择保存目录';body=`<div class="info">只读目录预览 · 所有路径均为示例，非 NAS 数据。</div><div class="chips">${btn('授权根','directory-root')}${btn('上一级','directory-up')}</div><p class="muted">当前位置：${type==='directory'?'示例授权根':'/示例/媒体'}</p>${type==='directory'?`<button class="path-row" data-action="directory-enter"><span>▣ /示例/媒体<small>示例可见入口 · 点开演示权限失败</small></span><span>›</span></button><button class="path-row" disabled><span>▣ /示例/归档<small>未授权 · 不可选择</small></span><span>锁定</span></button>`:`<div class="error-box" role="alert"><strong>无法读取此目录</strong>AUTH_PACKAGE_READ_DENIED<p>现场问题尚未修复。父路径 O_RDONLY | O_DIRECTORY 可能对仅可遍历的父目录过度要求读取权限；不能把它归为用户未授权或宣称方向完全正确。</p></div>${btn('重试（仍失败）','directory-retry')}`}<div class="info">当前没有验证成功的可选目录。返回后保留原表单，不制造选择成功。</div>`;foot=btn('返回','back')+'<button disabled>使用此目录（不可用）</button>'}
else if(type==='detail'){title='任务详情';body=detailContent();foot=btn('返回任务','back')+`<button data-toggle="${S.detail}">暂停 / 继续</button>`}
else if(type==='filters'){title='筛选任务';body=`<h3>分类</h3><div class="chips">${['电影','剧集','音乐','软件'].map(v=>`<button class="${S.facet===v?'active':''}" data-facet="${v}">${v}</button>`).join('')}</div><h3>标签</h3><div class="chips">${['PT','保种','MoviePilot'].map(v=>`<button class="${S.tag===v?'active':''}" data-tag="${v}">${v}</button>`).join('')}</div><div class="info">分类与标签可组合；状态和搜索继续生效。</div>`;foot=btn('清除全部','clear')+btn('查看结果','back','class="primary"')}
else if(type==='confirm-pause'||type==='confirm-remove'){let remove=type==='confirm-remove';title=remove?'确认移除示例任务':'暂停前确认';body=`<div class="error-box"><strong>保种规则提醒</strong>所选任务可能有 PT 保种义务。此原型不能判断站点规则是否满足。</div><p>操作对象：${S.selected.size||1} 项示例任务。不影响 NAS。</p>${remove?'<label class="inline"><input id="delete-data" type="checkbox"> 同时删除数据（仅模拟，默认不勾选）</label>':''}`;foot=btn('保留任务','back')+btn(remove?'确认移除（示例）':'确认暂停（示例）',remove?'confirm-remove':'confirm-pause','class="danger"')}
else if(type==='batch-tags'){title='批量添加标签';body='<p>为选中的示例任务添加标签，不替换已有标签。</p><select id="batch-tag-value"><option>保种</option><option>PT</option><option>MoviePilot</option></select>';foot=btn('返回','back')+btn('应用标签（示例）','apply-batch-tag','class="primary"')}
else if(type==='mp-info'){title='MoviePilot 入口';body='<p>产品应保留独立打开 MoviePilot 的入口，并检查配置地址。</p><div class="info">本原型使用 example.invalid 占位，不启动外部服务，不包含凭据。</div>';foot=btn('知道了','back')}
$('#sheet').innerHTML=`<header><h2>${title}</h2>${btn('返回','back','aria-label="返回上一层" class="quiet"')}</header><div class="body">${body}</div><footer>${foot}</footer>`}
async function processing(label,fn){if(S.pending)return;S.pending=true;notify(label+'处理中 · 示例');await new Promise(r=>setTimeout(r,650));fn();S.pending=false;render();notify(label+'完成 · 仅修改示例数据')}
function ids(){return S.selected.size?[...S.selected]:[S.detail]}
function pauseSelected(){processing('暂停',()=>tasks.filter(t=>ids().includes(t.id)).forEach(t=>t.state='暂停'))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.station){S.station=b.dataset.station;S.scrolls.tasks=0;navigate('tasks');return}if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.status){S.status=b.dataset.status;S.nav='tasks';S.selected.clear();render();return}if(b.dataset.facet||b.dataset.tag){if(b.dataset.facet)S.facet=b.dataset.facet;else S.tag=b.dataset.tag;S.nav='tasks';S.selected.clear();S.selectMode=false;render();if($('#sheet').open){closeSheet();}return}if(b.dataset.detail){S.detail=+b.dataset.detail;S.tab='概况';if(innerWidth<=700)openSheet('detail');else render();return}if(b.dataset.tab){S.tab=b.dataset.tab;if($('#sheet').open)drawSheet();else render();return}if(b.dataset.toggle){let t=tasks.find(t=>t.id===+b.dataset.toggle);if(t.state==='暂停')processing('继续',()=>t.state=t.progress===100?'做种':'下载中');else{S.detail=t.id;S.selected.clear();openSheet('confirm-pause')}return}const a=b.dataset.action;if(!a)return;
if(a.startsWith('analysis-state:')){S.analysisView=a.split(':')[1];render();return}if(a.startsWith('state:')){S.view=a.split(':')[1];render();return}
switch(a){case'return-tasks':navigate('tasks');break;case'clear-station':S.station='';render();break;case'analysis-refresh':S.analysisView='loading';render();setTimeout(()=>{S.analysisView='ready';S.analysisUpdated='刚刚刷新 · 示例时刻';render()},800);break;case'add':openSheet('add');break;case'back':rememberAdd();closeSheet();break;case'directory':rememberAdd();openSheet('directory');break;case'directory-enter':openSheet('directory-denied');break;case'directory-retry':notify('重试中 · 示例');setTimeout(()=>notify('AUTH_PACKAGE_READ_DENIED · 问题未修复'),650);break;case'directory-root':if(S.stack.at(-1)==='directory-denied')closeSheet();break;case'directory-up':if(S.stack.at(-1)==='directory-denied')closeSheet();else notify('已在示例授权根');break;case'filters':if(S.nav!=='tasks')navigate('tasks');openSheet('filters');break;case'clear':S.station='';S.q='';S.facet='';S.tag='';S.status='全部';S.view='ready';render();if($('#sheet').open)drawSheet();break;case'retry':S.view='loading';render();setTimeout(()=>{S.view='ready';render();notify('示例加载完成；非真实连接恢复')},800);break;case'select-mode':{S.selectMode=!S.selectMode;S.selected.clear();render();break}case'cancel-selection':S.selected.clear();S.selectMode=false;renderBatch();render();break;case'batch-pause':openSheet('confirm-pause');break;case'batch-resume':processing('继续',()=>tasks.filter(t=>S.selected.has(t.id)).forEach(t=>t.state=t.progress===100?'做种':'下载中'));break;case'batch-remove':openSheet('confirm-remove');break;case'batch-tag':openSheet('batch-tags');break;case'apply-batch-tag':{let tag=$('#batch-tag-value').value;processing('添加标签',()=>tasks.filter(t=>S.selected.has(t.id)).forEach(t=>{if(!t.tags.includes(tag))t.tags.push(tag)}));closeSheet();break}case'confirm-pause':pauseSelected();closeSheet();break;case'confirm-remove':{const selected=ids();processing('移除',()=>{for(let i=tasks.length-1;i>=0;i--)if(selected.includes(tasks[i].id))tasks.splice(i,1);S.selected.clear();S.detail=0});closeSheet();break}case'close-detail':S.detail=0;render();break;case'remove':openSheet('confirm-remove');break;case'apply-ratio':processing('应用保种目标',()=>{});break;case'announce':processing('重新汇报',()=>{});break;case'recheck':processing('重新校验',()=>{});break;case'save-settings':if(['download-limit','upload-limit','global-ratio'].some(id=>!$('#'+id).checkValidity()))notify('请输入非负数值');else processing('保存策略',()=>{});break;case'mp-info':openSheet('mp-info');break;case'mp-test':$('#mp-status').innerHTML='<div class="info">正在测试 · 示例…</div>';setTimeout(()=>{$('#mp-status').innerHTML='<div class="error-box">示例：服务不可达。未连接 MoviePilot。</div>'},700);break;case'opaque':document.body.classList.toggle('opaque');notify('已切换导航透明度');break;case'reset':location.reload();break;case'submit-add':{rememberAdd();let file=$('#torrent-file').files[0];if(!S.add.url.trim()&&!file){$('#add-error').innerHTML='<div class="error-box">请粘贴链接或选择 .torrent 文件。</div>';break}if(S.add.url.trim()&&!S.add.url.trim().split(/\n/).every(x=>/^(magnet:\?|https?:\/\/)/.test(x))){$('#add-error').innerHTML='<div class="error-box">示例校验：仅接受 magnet: 或 HTTP(S) 链接。</div>';break}processing('添加示例任务',()=>{tasks.unshift({id:Date.now(),name:'新添加任务 · 示例，非 NAS 数据',state:S.add.paused?'暂停':'下载中',cat:S.add.cat,tags:[S.add.tag],progress:0,size:'待解析',down:'—',up:'—',eta:'待解析',ratio:'0.00'});S.nav='tasks';S.status='全部';S.q='';S.facet='';S.tag='';S.view='ready'});closeSheet();break}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.q=e.target.value;let p=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(p,p)}if(e.target.id==='panel-width')document.documentElement.style.setProperty('--panel',e.target.value+'px')});
document.addEventListener('change',e=>{if(e.target.id==='seed-scope'){S.seedScope=e.target.value;render()}if(e.target.id==='analysis-sort'){S.analysisSort=e.target.value;render()}if(e.target.dataset.select){let id=+e.target.dataset.select;S.selected.has(id)?S.selected.delete(id):S.selected.add(id);render()}if(e.target.id==='select-all'){filtered().forEach(t=>e.target.checked?S.selected.add(t.id):S.selected.delete(t.id));render()}if(e.target.id==='sort'){S.sort=e.target.value;render()}if(e.target.id==='file-priority')notify('文件优先级已在原型中模拟更新')});
$('#refresh').onclick=()=>{if(S.nav==='analysis'){document.querySelector('[data-action=analysis-refresh]').click();return}S.view='loading';render();setTimeout(()=>{S.view='ready';render();notify('示例已刷新 · 未连接 NAS')},800)};
$('#sheet').addEventListener('cancel',e=>{e.preventDefault();rememberAdd();closeSheet()});window.addEventListener('popstate',()=>{if(S.stack.length)closeSheet(true)});if(location.hash==='#analysis')S.nav='analysis';window.addEventListener('resize',()=>{if(!$('#sheet').open)render()});render();
</script></body></html>
